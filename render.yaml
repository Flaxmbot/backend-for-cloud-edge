services:
  - type: web
    name: cloud-edge-os-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CODE_EXECUTION_TIMEOUT
        value: 30000
      - key: MAX_OUTPUT_BUFFER
        value: 10485760
